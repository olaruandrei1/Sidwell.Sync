name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
      - run: dotnet build
      - run: dotnet test --no-build

  yfinance:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps & test
        working-directory: yfinance
        run: |
          pip install -r requirements-dev.txt
          python manage.py test
